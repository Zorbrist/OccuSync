services:
  db:
    image: postgres:16-alpine
    container_name: occusync-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: occusync
      POSTGRES_USER: occusync
      POSTGRES_PASSWORD: occusync_dev
    volumes:
      - occusync_pg_data:/var/lib/postgresql/data
      - ./backend-OccuSync/supabase/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./backend-OccuSync/supabase/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occusync -d occusync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-OccuSync
      dockerfile: Dockerfile
    container_name: occusync-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend-OccuSync/.env
    environment:
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-OccuSync
      dockerfile: Dockerfile
    container_name: occusync-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  occusync_pg_data: